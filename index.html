<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>BitKit — 59 private browser tools, no uploads</title>
    <meta
      name="description"
      content="BitKit is a free, privacy-first toolbox: compress images, shrink PDFs, clean CSVs, make charts, trim video, generate QR codes and more. Everything runs in your browser — no account, no uploads."
    />
    <link rel="canonical" href="https://bitkit.pages.dev/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f4f7f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1413" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BitKit" />
    <meta property="og:title" content="BitKit — 59 private browser tools, no uploads" />
    <meta
      property="og:description"
      content="Compress images, shrink PDFs, clean CSVs, make charts, trim video, and 54 more tools. All local to your browser."
    />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // Paint the stored (or system) theme before first render so the page
      // never flashes light while a dark theme is loading.
      ;(function () {
        try {
          var stored = localStorage.getItem('bitkit-theme')
          var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>BitKit runs entirely in the browser and needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
