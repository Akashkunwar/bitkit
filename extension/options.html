<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Send to BitKit</title>
    <style>
      body {
        font:
          16px/1.5 system-ui,
          sans-serif;
        max-width: 36rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      input {
        width: 100%;
        padding: 0.5rem;
        font: inherit;
      }
      button {
        margin-top: 0.8rem;
        padding: 0.45rem 0.8rem;
      }
    </style>
  </head>
  <body>
    <h1>Send to BitKit</h1>
    <p>
      Set the address of your BitKit install, for example <code>https://bitkit.pages.dev</code> or
      <code>http://localhost:5173</code>. A click sends the selection or image only to a tab on that address.
    </p>
    <label>
      BitKit address
      <input id="origin" type="url" placeholder="https://bitkit.pages.dev" />
    </label>
    <button id="save" type="button">Save</button>
    <p id="status"></p>
    <script src="options.js"></script>
  </body>
</html>
